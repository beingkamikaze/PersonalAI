                - paragraph [ref=f30e80]: "Thanks for asking. Here are a few recent projects I’ve been working on, focused on AI-driven SaaS and scalable backend systems:"
                - list [ref=f30e81]:
                  - listitem [ref=f30e82]:
                    - generic [ref=f30e84]: "Agentic AI sales platform on Microsoft Dynamics 365: I contributed to an enterprise sales automation platform for Lenovo, built around event-driven microservices and AI orchestration. I engineered backend services for AI workflows like meeting summarization, automated follow-ups, and CRM updates, and integrated Azure OpenAI, RAG pipelines, and Copilot Studio. I also implemented secure REST APIs and data pipelines for deal tracking and account intelligence, with real-time sync across Dynamics 365 (Dataverse) and external systems. Stack: Java, Spring Boot, Azure, Kafka, D365/Dataverse, Azure OpenAI."
                - list [ref=f30e85]:
                  - listitem [ref=f30e86]:
                    - generic [ref=f30e88]: "LTI 1.3 integrations for Wingspan LMS: I designed and delivered OAuth 2.0/JWT-based LTI 1.3 backend integrations to enable secure interoperability with external learning platforms. I built Spring Boot microservices powering course delivery, grading workflows, and learner activity tracking—supporting AWS Skill Builder’s rollout to 100k+ students via Infosys Springboard. I also implemented grading-progress modules per LTI spec, improving score update latency/accuracy by ~50%, and architected a Kafka-based async pipeline for content ingestion and certificate generation (for Deutsche Bahn). Stack: Java, Spring Boot, Kafka, AWS."
                - list [ref=f30e89]:
                  - listitem [ref=f30e90]:
                    - generic [ref=f30e92]: "Ratings and Likes backend service: I architected a high-throughput feedback service for Wingspan LMS, exposing REST APIs for real-time ratings/likes. I optimized queries and indexing to handle heavy read/write traffic, improving content discovery and engagement, and led production debugging and observability improvements."
                - list [ref=f30e93]:
                  - listitem [ref=f30e94]:
                    - generic [ref=f30e96]: "MCP Natural Language Query Server: A side project where I built a Spring Boot REST API that lets users issue natural-language queries against a database via GPT-4, with strict guardrails—only read-only SELECTs, pagination, and execution-time tracking. It supports H2/PostgreSQL/MySQL via Spring Data JPA and layered architecture. Stack: Java 17, Spring Boot, OpenAI API."
                - list [ref=f30e97]:
