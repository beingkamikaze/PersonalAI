              - generic [ref=f30e163]:
                - paragraph [ref=f30e164]: "I’ve been focused on building AI-driven SaaS backends and event-driven systems. Here are a few recent projects I’m proud of:"
                - list [ref=f30e165]:
                  - listitem [ref=f30e166]:
                    - generic [ref=f30e168]: "Agentic AI sales platform (Enterprise, in production): I contributed to an AI-powered sales platform on Microsoft Dynamics 365 for an enterprise rollout. I engineered event-driven microservices and integrations with Dataverse and external systems, enabling real-time sync and AI orchestration. I built backend services for AI workflows like meeting summarization, automated follow-ups, and CRM updates. I also worked on multi-agent orchestration with Azure OpenAI, RAG pipelines, and Copilot Studio to deliver context-aware recommendations and next-best actions. Stack: Java, Spring Boot, REST APIs, Kafka, Azure, Dynamics 365/Dataverse."
                - list [ref=f30e169]:
                  - listitem [ref=f30e170]:
                    - generic [ref=f30e172]: "Secure LTI integrations for LMS: I designed LTI 1.3–compliant backend integrations for a learning platform (Wingspan), using OAuth 2.0 and JWT to interoperate with external providers. I built Spring Boot microservices for course delivery, grading workflows, and learner activity tracking—driving nationwide delivery of free courses at scale. I implemented grading and progress-tracking modules per LTI, improving score update latency and accuracy by about 50%. Stack: Java, Spring Boot, AWS, Kafka, REST APIs, JWT."
                - list [ref=f30e173]:
                  - listitem [ref=f30e174]:
                    - generic [ref=f30e176]: "Kafka-based async content pipeline: I engineered a Kafka pipeline to ingest external course content and generate certificates for a high-volume education use case. The pipeline improved throughput and fault tolerance, with stronger observability and retry semantics."
                - list [ref=f30e177]:
                  - listitem [ref=f30e178]:
                    - generic [ref=f30e180]: "Ratings and Likes service: I architected a backend service to capture real-time feedback (ratings/likes) for content discovery. I optimized queries and indexing to handle high read/write traffic and exposed REST APIs consumed by multiple frontend clients."
                - list [ref=f30e181]:
                  - listitem [ref=f30e182]:
                    - generic [ref=f30e184]: "MCP Natural Language Query Server: I built a Spring Boot REST API that lets users run natural-language database queries via GPT-4, while enforcing strict read-only SELECT constraints with pagination and execution time tracking. It supports H2, PostgreSQL, and MySQL with environment-based configs. Stack: Java 17, Spring Boot, Spring Data JPA, OpenAI API."
                - list [ref=f30e185]:
                  - listitem [ref=f30e186]:
                    - generic [ref=f30e188]: "Salon appointment backend (microservices): I designed microservices for scheduling, payments, and notifications with modular handlers and thorough unit testing.…"
